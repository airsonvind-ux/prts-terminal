name: Release

on:
  workflow_dispatch:
    inputs:
      data_version:
        description: "Data release version, e.g. 2026.10.25"
        required: true
        type: string
      dry_run:
        description: "Build without signing or publishing (local/CI smoke only)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            bridge

      - name: Install dependencies
        run: npm ci

      - name: Build MAA sidecar
        run: python src-tauri/build-sidecar.py

      - name: Fetch frozen data release
        env:
          GITHUB_TOKEN: ${{ secrets.DATA_REPO_TOKEN || github.token }}
        run: |
          node scripts/fetch-data-release.mjs `
            --repo "${{ vars.DATA_REPO || vars.RELEASE_REPO }}" `
            --data-version "${{ inputs.data_version }}" `
            --out-dir "src-tauri/resources" `
            --force

      - name: Read project version
        id: version
        run: |
          $version = node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build unsigned smoke
        if: ${{ inputs.dry_run }}
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1 -NoSign -Jobs 4

      - name: Build signed release
        if: ${{ !inputs.dry_run }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1 `
            -Jobs 4 `
            -GiteeRepo "${{ vars.GITEE_REPO }}" `
            -GitHubRepo "${{ vars.RELEASE_REPO }}"

      - name: Upload release staging
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: release-staging
          path: release-staging/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload smoke installer
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            build-log-*.txt
          if-no-files-found: error
          retention-days: 3

  publish:
    if: ${{ !inputs.dry_run }}
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download release staging
        uses: actions/download-artifact@v4
        with:
          name: release-staging
          path: release-staging

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          node scripts/publish-release.mjs \
            --staging-dir "release-staging/${{ needs.build.outputs.version }}" \
            --github-repo "${{ vars.RELEASE_REPO }}" \
            --gitee-repo "${{ vars.GITEE_REPO }}"
