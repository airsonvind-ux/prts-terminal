name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --tests --lib --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Check backend
        run: cargo check --lib --manifest-path src-tauri/Cargo.toml
      - name: Compile tests
        run: cargo test --lib --no-run --manifest-path src-tauri/Cargo.toml
      - name: Compile data-contract tests
        run: cargo test --lib --no-run --manifest-path src-tauri/Cargo.toml --features data-contract

  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
      - run: cargo check --manifest-path bridge/Cargo.toml
