name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            bridge
      - name: Build MAA sidecar
        run: python src-tauri/build-sidecar.py
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --tests --lib --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Check backend
        run: cargo check --locked --lib --manifest-path src-tauri/Cargo.toml
      - name: Test unit suite
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml
      - name: Compile data-contract tests
        run: cargo test --locked --lib --no-run --manifest-path src-tauri/Cargo.toml --features data-contract

  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
      - name: Test bridge
        run: cargo test --locked --manifest-path bridge/Cargo.toml
