[package]
name = "prts-terminal"
version = "0.1.0"
description = "PRTS Terminal：面向明日方舟的专用 Agent 终端助手（桌面应用）"
authors = ["AirsonVind"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prts_terminal_lib"
# cdylib 已移除：桌面构建（--bins）不需要它（移动端产物）。
# staticlib 同样移除（2026-10-11）：它会把所有依赖的目标码打进一个静态库，
# 每构建一次产出约 340 MB（debug）/ 约 120 MB（release）的文件，而桌面构建
# 用不上它——实测 debug 侧因此堆积了 42 份、共 14.28 GB。
#
# 2026-08-15 打包排查曾把 sqlite3.o 的 __imp_strchr/strrchr/memchr 链接失败归因于
# cdylib；2026-10-10 定位到真正原因：tauri build 会设 STATIC_VCRUNTIME=true，
# tauri-build 随即要求静态 VC 运行时，而随包的 sqlite3.c 默认按动态运行时编译，
# 两边不一致才导致符号找不到。修法见 src-tauri/.cargo/config.toml（统一 crt-static）。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# PC 端截图：Windows Graphics Capture（从合成器层取画面，不需要管理员权限）。
# 仅 Windows 目标编译；其余平台走 capture.rs 的 cfg(not(windows)) 桩。
[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.0"

# 单实例闸（R-15）：桌面目标才编译；第二实例由插件在进入 Builder 前拦截。
# 插件必须在其它插件之前注册（见 lib.rs）。
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 应用内更新：清单解析、签名校验与 NSIS 安装由插件承担；
# 源切换、重试与安装前保护由 Rust 层负责（4.4）。
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 更新源版本比较（多源时选出最高版本）
semver = "1"
# 更新源端点解析（tauri-plugin-updater 的 endpoints 入参）
url = "2"
# 命令输出的 GBK 兜底解码（Windows 中文控制台，见 exec/runner.rs）
encoding_rs = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
# 图片附件的物化压缩（解码 → 缩边 → 重编码 JPEG）。
# 特性裁剪：只开需要解码/编码的格式，其余（tiff/avif/exr 等）不编译。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
futures-util = "0.3"
log = "0.4"
# 文件工具 grep 的匹配引擎（Rust 生态基础库：无回溯、线性时间；
# 不引入 ignore/walkdir——依赖树保持极简，gitignore 语义自研见 tools/fs_grep.rs）
regex = "1"
# 时间参照工具（Phase4 1.3）：本地时间、星期、UTC 偏移与格式化。
# 特性裁剪：仅需 clock（now / Local），不带 oldtime / wasmbind。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# IANA 时区名（如 Asia/Shanghai；Windows 走 WinRT Calendar）。
# chrono 的 clock 特性本就依赖它，版本同源、无额外分裂。
iana-time-zone = "0.1"
# 通用重试的退避 sleep（缺陷 3）：复用 Tauri 的 tokio runtime
# macros：M3-B 取消点 select!（dispatch_turn / preflight）
tokio = { version = "1", features = ["time", "sync", "macros"] }
# env_logger = "0.11"
# M4 降权执行：Windows 受限令牌 / Job / ACL / 进程创建。
# 复用 tauri 依赖链已锁定的 windows 0.61（Cargo.lock 同版本，不引入第二份）；
# feature 只开实现所需模块，随 tauri 既有 feature 并集编译。
# 非 Windows 目标不编译（exec/spawn_win32.rs 由 #[cfg(windows)] 门控）。
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    # 密钥加密落盘（DPAPI）：CryptProtectData / CryptUnprotectData
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    # PC 端截图：FindWindowW（认窗口）+ IsIconic（最小化预检）
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Threading",
    # R-18：后端写入系统剪贴板（API Key 只复制，不回前端明文）
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # 更新前磁盘空间预检：GetDiskFreeSpaceExW
    "Win32_Storage_FileSystem",
] }
# M5 网络层：web_fetch 的 HTML 正文提取（readabilityrs = Mozilla Readability 的 Rust 移植，
# Firefox Reader View 同源算法；输入纯 HTML 字符串，输出 text/markdown 双形态，不自带 fetch）。
# 精确 pin：0.1.x 阶段 API 可能变动，升级由主对话主动决策（2026-09-05 选型核实，锁 ≥0.1.4
# 的安全加固：script 泄漏修复 / 递归深度上限 / markdown 注入封堵）。
# 传递依赖为 scraper/html5ever 系（约 11-14 crate，冷编译 +40~120s 一次性）。
readabilityrs = "=0.1.4"
tauri-plugin-prevent-default = "5"

[features]
# 真实数据库数据契约测试。默认关闭：默认套件不依赖本地
# resources/arknights.db；专用命令见 docs/testing.md。
data-contract = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# 体积控制（2026-10-11）：
# - 依赖不带调试符号：我们基本不会调试进依赖内部，自己代码仍保留完整信息。
#   这一项消掉的是体积大头（每个依赖的符号往往是其代码的数倍）。
[profile.dev.package."*"]
debug = false

